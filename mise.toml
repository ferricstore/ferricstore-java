[tools]
java = "temurin-21.0.12+101.0.LTS"
maven = "3.9.16"

[tasks.test]
description = "Run the reactor tests on the build JDK"
run = "mvn -B test"

[tasks."test:java17"]
description = "Run the reactor tests on the minimum supported runtime"
run = "mise exec java@temurin-17 -- mvn -B clean test"

[tasks.quality]
description = "Run formatting, static analysis, and tests"
run = "mvn -B -Pquality verify"

[tasks.integration]
description = "Run native-protocol integration tests against local FerricStore"
run = "FERRICSTORE_INTEGRATION=1 mvn -B -pl ferricstore-java -am -Dtest=FerricStoreIntegrationTest test"
