name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-scripts:
    name: release automation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/test-extract-central-deployment-id.sh
      - run: scripts/test-wait-for-central-publish.sh
      - run: scripts/test-verify-maven-central-release.sh

  unit:
    name: unit java-${{ matrix.java-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21, 25]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
      - run: mvn -B test

  quality:
    name: quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -Pquality verify

  package:
    name: release dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B clean
      - run: >-
          mvn -B -Prelease -Dgpg.skip=true
          -pl ferricstore-java,ferricstore-spring-statemachine,ferricstore-spring-boot-starter
          -am package
      - run: scripts/verify-release-layout.sh

  integration:
    name: native TCP command and concurrency integration java-${{ matrix.java-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
      - run: docker compose up -d ferricstore
      - run: scripts/wait-for-ferricstore.sh
      - run: >-
          mvn -B -pl ferricstore-java -am
          -Dtest=FerricStoreIntegrationTest,FerricStoreCommandArgumentsIntegrationTest,FerricStoreFlowArgumentsIntegrationTest,FerricStoreConcurrencyIntegrationTest,DurableStepRecoveryIntegrationTest test
        env:
          FERRICSTORE_INTEGRATION: "1"
      - if: always()
        run: docker compose logs ferricstore
      - if: always()
        run: docker compose down -v

  http-integration:
    name: authenticated TLS HTTP command and concurrency integration java-${{ matrix.java-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21]
    env:
      FERRICSTORE_IMAGE: quay.io/ferricstore/ferricstore:0.11.14@sha256:f7d29befefa15bce4b3755bf786cf7620c814f13bbd336c0d9955581b323b60e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
      - run: scripts/run-http-integration-matrix.sh
