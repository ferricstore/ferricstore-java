name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-scripts:
    name: release automation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/test-extract-central-deployment-id.sh
      - run: scripts/test-wait-for-central-publish.sh
      - run: scripts/test-verify-maven-central-release.sh
      - run: scripts/test-verify-release-bundle.sh

  unit:
    name: unit java-${{ matrix.java-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21, 25]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
      - run: mvn -B test

  quality:
    name: quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -Pquality verify

  package:
    name: release dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B clean
      # Builds the same Central bundle a release uploads, with the runner's
      # Maven, and checks it here instead of letting Central reject the release.
      - run: >-
          mvn -B -Prelease -Dgpg.skip=true -DskipUpload=true
          -pl ferricstore-java,ferricstore-spring-statemachine,ferricstore-spring-boot-starter
          -am deploy
      - run: scripts/verify-release-layout.sh
      - run: scripts/verify-release-bundle.sh
        env:
          RELEASE_BUNDLE_UNSIGNED: "1"

  integration:
    name: native TCP command and concurrency integration java-${{ matrix.java-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
      - run: docker compose up -d ferricstore
      - run: scripts/wait-for-ferricstore.sh
      - run: >-
          mvn -B -pl ferricstore-java -am
          -Dtest=FerricStoreIntegrationTest,FerricStoreRewindReasonIntegrationTest,FerricStoreCommandArgumentsIntegrationTest,FerricStoreFlowArgumentsIntegrationTest,FerricStoreConcurrencyIntegrationTest,DurableStepRecoveryIntegrationTest test
        env:
          FERRICSTORE_INTEGRATION: "1"
      - if: always()
        run: docker compose logs ferricstore
      - if: always()
        run: docker compose down -v

  http-integration:
    name: authenticated TLS HTTP command and concurrency integration java-${{ matrix.java-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21]
    env:
      FERRICSTORE_IMAGE: quay.io/ferricstore/ferricstore:0.12.18@sha256:e98e6ef91e028965598a2ed1b68981bab826a64749d97f6fecd6ecd4687bd3e1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
      - run: scripts/run-http-integration-matrix.sh
