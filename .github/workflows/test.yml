name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit java-${{ matrix.java-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21, 25]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
      - run: mvn -B test

  quality:
    name: quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -P quality verify

  package:
    name: release dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B clean
      - run: >-
          mvn -B -P release -Dgpg.skip=true
          -pl ferricstore-java,ferricstore-spring-statemachine,ferricstore-spring-boot-starter
          -am package
      - run: scripts/verify-release-layout.sh

  integration:
    name: native TCP command and concurrency integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: docker compose up -d ferricstore
      - run: scripts/wait-for-ferricstore.sh
      - run: >-
          mvn -B -pl ferricstore-java -am
          -Dtest=FerricStoreIntegrationTest,FerricStoreConcurrencyIntegrationTest test
        env:
          FERRICSTORE_INTEGRATION: "1"
      - if: always()
        run: docker compose logs ferricstore
      - if: always()
        run: docker compose down -v

  http-integration:
    name: authenticated TLS HTTP command and concurrency integration
    runs-on: ubuntu-latest
    env:
      FERRICSTORE_IMAGE: quay.io/ferricstore/ferricstore:0.11.11@sha256:d9f488539f0d6c1a513d2315e7a9c2947cc795b393f3774c9de8ba5e5b5c21b5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: scripts/run-http-integration.sh
