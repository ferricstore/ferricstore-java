name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: release integration gates java-${{ matrix.java-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21]
    env:
      FERRICSTORE_IMAGE: quay.io/ferricstore/ferricstore:0.11.14@sha256:f7d29befefa15bce4b3755bf786cf7620c814f13bbd336c0d9955581b323b60e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
      - if: matrix.java-version == 17
        run: mvn -B test
      - if: matrix.java-version == 21
        run: mvn -B -Pquality verify
      - run: docker compose up -d ferricstore
      - run: scripts/wait-for-ferricstore.sh
      - run: >-
          mvn -B -pl ferricstore-java -am
          -Dtest=FerricStoreIntegrationTest,FerricStoreCommandArgumentsIntegrationTest,FerricStoreFlowArgumentsIntegrationTest,FerricStoreConcurrencyIntegrationTest,DurableStepRecoveryIntegrationTest test
        env:
          FERRICSTORE_INTEGRATION: "1"
      - if: always()
        run: docker compose logs ferricstore
      - if: always()
        run: docker compose down -v
      - run: scripts/run-http-integration-matrix.sh

  maven-central:
    name: publish maven central
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - run: mvn -B -Pquality verify
      - run: scripts/verify-release-tag.sh
      - name: Upload one Maven Central deployment
        id: central-upload
        run: |
          mvn -B -Prelease \
            -pl ferricstore-java,ferricstore-spring-statemachine,ferricstore-spring-boot-starter \
            -am deploy | tee central-publish.log
          deployment_id="$(scripts/extract-central-deployment-id.sh central-publish.log)"
          echo "deployment_id=${deployment_id}" >>"${GITHUB_OUTPUT}"
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - run: scripts/verify-release-bundle.sh
      - name: Wait for the accepted Central deployment
        run: scripts/wait-for-central-publish.sh "${{ steps.central-upload.outputs.deployment_id }}"
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      - name: Verify fresh Maven Central resolution
        run: scripts/verify-maven-central-release.sh "${GITHUB_REF_NAME#v}"
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
